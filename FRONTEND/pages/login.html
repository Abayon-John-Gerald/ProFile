<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProFile — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/auth.css">
  <style>
    /* Custom two-column layout styles for the login page */
    body {
      display: flex;
      align-items: stretch;
    }

    .left-panel {
      width: 45%;
      background: #2B3A2E;
      background-image: radial-gradient(ellipse 70% 50% at 30% 20%, rgba(143, 184, 154, 0.18) 0%, transparent 60%), radial-gradient(ellipse 50% 40% at 75% 85%, rgba(107, 158, 120, 0.12) 0%, transparent 55%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 44px;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%238FB89A' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      background: #EDEAE3;
      background-image: radial-gradient(ellipse 60% 40% at 90% 10%, rgba(143, 184, 154, 0.09) 0%, transparent 55%);
    }

    .form-box {
      width: 100%;
      max-width: 380px;
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(16px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .form-title {
      font-family: "DM Serif Display", serif;
      font-size: 26px;
      color: #2B3A2E;
      margin-bottom: 6px;
    }

    .form-sub {
      font-size: 13px;
      color: #7A776E;
      margin-bottom: 32px;
    }

    .form-sub a {
      color: #4A6350;
      text-decoration: none;
      font-weight: 500;
    }

    .form-sub a:hover {
      text-decoration: underline;
    }

    .btn {
      height: 46px;
      background: linear-gradient(135deg, #2B3A2E 0%, #3d5241 100%);
      color: #F0EDE5;
      border: none;
      border-radius: 10px;
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(43, 58, 46, 0.22);
      transition: opacity 0.12s, transform 0.1s, box-shadow 0.12s;
    }

    .btn:hover {
      opacity: 0.9;
      box-shadow: 0 6px 20px rgba(43, 58, 46, 0.28);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .error {
      background: #FDF0F0;
      color: #A32D2D;
      border: 1px solid #F5C6C6;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      animation: shake 0.3s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(240, 237, 229, 0.3);
      border-top-color: #F0EDE5;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .left-panel {
        width: 100%;
        min-height: 260px;
        padding: 32px 28px;
      }

      .right-panel {
        padding: 36px 24px;
      }
    }
  </style>
</head>

<body>
  <div class="left-panel">
    <div class="panel-brand"
      style="font-family:'DM Serif Display',serif; font-size:26px; color:#EAE6DC; position:relative; z-index:1;">
      Pro<span style="color:#8FB89A;">File</span></div>
    <div class="resume-stack"
      style="display:flex; align-items:center; justify-content:center; flex:1; padding:20px 0; position:relative; z-index:1;">
    </div>
    <div class="panel-tagline" style="position:relative; z-index:1;">
      <h2
        style="font-family:'DM Serif Display',serif; font-size:22px; color:#EAE6DC; line-height:1.35; margin-bottom:8px;">
        Your resume,<br>professionally done.</h2>
      <p style="font-size:13px; color:rgba(234,230,220,0.5); line-height:1.6;">Build, customize, and export<br>job-ready
        resumes in minutes.</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-box">
      <h1 class="form-title">Welcome to ProFile!</h1>
      <p class="form-sub">Don't have an account? <a href="register.html">Create one</a></p>

      <div class="error" id="errorMsg"></div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. juandelacruz" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>

      <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <script>
    if (localStorage.getItem("profile_token")) {
      window.location.href = "../template1.html"
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin()
    })

    async function doLogin() {
      const username = document.getElementById("username").value.trim()
      const password = document.getElementById("password").value
      const btn = document.getElementById("loginBtn")
      const err = document.getElementById("errorMsg")

      if (!username || !password) {
        showError("Please fill in all fields.")
        return
      }

      btn.disabled = true
      btn.innerHTML = '<span class="spinner"></span>Signing in...'
      err.style.display = "none"

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
        const data = await res.json()

        if (!res.ok) {
          showError(data.error || "Invalid username or password.")
          btn.disabled = false
          btn.textContent = "Sign In"
          return
        }

        localStorage.setItem("profile_token", data.token)
        localStorage.setItem("profile_user", JSON.stringify({ id: data.id, username: data.username, role: data.role }))
        if (data.role === "admin") {
          window.location.href = "admin.html"
        } else {
          window.location.href = "../template1.html"
        }

      } catch (e) {
        showError("Could not connect to server.")
        btn.disabled = false
        btn.textContent = "Sign In"
      }
    }

    function showError(msg) {
      const err = document.getElementById("errorMsg")
      err.textContent = msg
      err.style.display = "block"
    }
  </script>
</body>

</html>

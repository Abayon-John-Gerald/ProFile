<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProFile — System Access</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    /* Specific overrides for the dark admin login */
    body {
      background: #141918;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(74, 99, 80, 0.15) 0%, transparent 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1E2420;
      border: 1px solid #2A312B;
      box-shadow: 0 0 0 1px rgba(107, 158, 120, 0.04), 0 8px 60px rgba(0, 0, 0, 0.5);
      padding: 52px 44px;
    }

    .shield-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .shield {
      width: 52px;
      height: 52px;
      background: rgba(107, 158, 120, 0.1);
      border: 1px solid rgba(107, 158, 120, 0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6B9E78;
      box-shadow: 0 0 24px rgba(107, 158, 120, 0.12);
    }

    .auth-logo {
      color: #EAE6DC;
      margin-bottom: 4px;
    }

    .auth-logo span {
      color: #6B9E78;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #636B64;
      margin-bottom: 36px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field label {
      color: #636B64;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input {
      background: #141918;
      color: #EAE6DC;
      border-color: #2A312B;
    }

    .field input:focus {
      border-color: #6B9E78;
      box-shadow: 0 0 0 3px rgba(107, 158, 120, 0.12);
    }

    .field input::placeholder {
      color: #3A4240;
    }

    .btn-submit {
      background: linear-gradient(135deg, #3d5241 0%, #4A6350 100%);
      color: #EAE6DC;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .btn-submit:hover {
      background: #6B9E78;
      color: #141918;
      box-shadow: 0 6px 20px rgba(107, 158, 120, 0.2);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #636B64;
      text-decoration: none;
      transition: color 0.12s;
    }

    .back-link:hover {
      color: #EAE6DC;
    }

    .error-msg {
      display: none;
      background: rgba(192, 57, 43, 0.12);
      color: #E07070;
      border-color: rgba(192, 57, 43, 0.25);
      animation: shake 0.3s ease;
    }

    .spinner {
      border-color: rgba(232, 228, 218, 0.2);
      border-top-color: #EAE6DC;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-card card">
      <div class="shield-wrap">
        <div class="shield">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
      </div>

      <div class="auth-logo">Pro<span>File</span></div>
      <p class="subtitle">Administrator Access</p>

      <div class="error-msg" id="errorMsg"></div>

      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="Admin username" autocomplete="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Admin password" autocomplete="off">
      </div>

      <button class="btn-submit" id="loginBtn" onclick="doAdminLogin()">Access Dashboard</button>
      <a class="back-link" href="login.html">← Back to main site</a>
    </div>
  </div>

  <script>
    const stored = localStorage.getItem("profile_user")
    if (stored) {
      const u = JSON.parse(stored)
      if (u.role === "admin") window.location.href = "admin.html"
      else window.location.href = "login.html"
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doAdminLogin()
    })

    async function doAdminLogin() {
      const username = document.getElementById("username").value.trim()
      const password = document.getElementById("password").value
      const btn = document.getElementById("loginBtn")
      const err = document.getElementById("errorMsg")

      if (!username || !password) {
        showError("Please fill in all fields."); return
      }

      btn.disabled = true
      btn.innerHTML = '<span class="spinner"></span>Verifying...'
      err.style.display = "none"

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
        const data = await res.json()

        if (!res.ok || data.role !== "admin") {
          showError("Invalid credentials or insufficient permissions.")
          btn.disabled = false
          btn.textContent = "Access Dashboard"
          return
        }

        localStorage.setItem("profile_token", data.token)
        localStorage.setItem("profile_user", JSON.stringify({ id: data.id, username: data.username, role: data.role }))
        window.location.href = "admin.html"

      } catch (e) {
        showError("Could not connect to server.")
        btn.disabled = false
        btn.textContent = "Access Dashboard"
      }
    }

    function showError(msg) {
      const err = document.getElementById("errorMsg")
      err.textContent = msg
      err.style.display = "block"
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Resumes - ProFile</title>
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/my-resume.css">
</head>

<body>
  <script src="../js/auth-guard.js"></script>

  <header class="site-header">
    <a class="logo" href="login.html">Pro<span>File</span></a>
    <nav class="site-nav">
      <a class="nav-link" href="login.html">Home</a>
    </nav>
    <div class="header-actions">
      <a class="btn-ghost" href="form.html?template=1">New Resume</a>
      <button onclick="logout()" class="btn-reset">Sign Out</button>
    </div>
  </header>

  <main class="section">
    <div class="section-header">
      <div>
        <span class="section-kicker">Your Work</span>
        <h2 class="section-title">My Resumes</h2>
      </div>
      <span class="section-sub">Edit, duplicate, or download your saved resumes.</span>
    </div>

    <div id="resumeList" class="resume-grid"></div>
  </main>

  <!-- The external script handles the logic and template mockups -->
  <script>
    function getToken() { return localStorage.getItem('profile_token'); }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function getTemplateMockup(templateNum) {
      const mocks = {
        1: `<div class="template-preview preview-t1"><div class="p-sidebar" style="background:#2C2C2C;"></div><div style="position:absolute;left:0;top:0;width:24%;height:28%;background:#3A3A3A;"></div><div class="p-name" style="background:#1A1A18;"></div><div class="p-sub" style="background:#D4CFC4;"></div><div class="p-line p-line-1"></div><div class="p-line p-line-2"></div><div class="p-line p-line-3"></div><div class="p-line p-line-4"></div></div>`,
        2: `<div class="template-preview preview-t2"><div style="position:absolute;left:0;top:0;width:100%;height:22%;background:#4A5568;clip-path:polygon(0 0,100% 0,100% 75%,0 100%);"></div><div class="p-name" style="background:white;opacity:0.9;top:5%;left:6%;"></div><div class="p-sub" style="background:rgba(255,255,255,0.5);top:13%;left:6%;"></div><div class="p-line p-line-4"></div><div class="p-line p-line-5"></div></div>`,
        3: `<div class="template-preview preview-t3"><div class="p-name"></div><div class="p-sub"></div><div class="p-rule"></div><div class="p-line p-line-4"></div><div class="p-line p-line-5"></div></div>`,
        4: `<div class="template-preview preview-t4"><div class="p-col-l"></div><div class="p-name"></div><div class="p-sub"></div><div class="p-line p-line-1"></div><div class="p-line p-line-2"></div><div class="p-line-r p-line-4"></div><div class="p-line-r p-line-5"></div></div>`
      };
      return mocks[templateNum] || mocks[1];
    }

    async function loadResumes() {
      const token = getToken();
      const container = document.getElementById('resumeList');
      try {
        const res = await fetch('/api/resumes', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) {
          if (res.status === 401) { container.innerHTML = "<p>Session expired. Please <a href='login.html'>log in again</a>.</p>"; return; }
          throw new Error(`Server error: ${res.status}`);
        }
        const data = await res.json();
        container.innerHTML = '';
        if (!data.length) {
          container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #667060;'>No resumes yet. <a href='form.html?template=1' style='color: #76b25b;'>Create your first one!</a></p>";
          return;
        }
        data.forEach(r => {
          const card = document.createElement('div');
          card.className = 'resume-card';
          card.innerHTML = `
            <div class="resume-preview" style="position:relative;">${getTemplateMockup(r.template_num)}</div>
            <div class="resume-info">
              <span class="resume-name">${r.title || 'Untitled Resume'}</span>
              <span style="font-size:11px; color:#999; display:block; margin-top:2px;">Last updated: ${r.updated_at ? formatDate(r.updated_at) : 'N/A'}</span>
              <div style="display:flex; gap:6px; margin-top:12px;">
                <button onclick="editResume(${r.id}, ${r.template_num})" class="btn-ghost">Edit</button>
                <button onclick="deleteResume(${r.id})" class="btn-danger">Delete</button>
              </div>
            </div>`;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Failed to load resumes:', err);
        container.innerHTML = "<p>Something went wrong loading your resumes. Please try again later.</p>";
      }
    }

    function editResume(id, templateNum) { window.location.href = `form.html?id=${id}&template=${templateNum}`; }

    async function deleteResume(id) {
      if (!confirm("Delete this resume? This cannot be undone.")) return;
      try {
        const res = await fetch(`/api/resumes/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${getToken()}` } });
        if (!res.ok) throw new Error('Delete failed');
        loadResumes();
      } catch (err) { alert('Could not delete. Please try again.'); }
    }

    loadResumes();
  </script>
</body>

</html>
